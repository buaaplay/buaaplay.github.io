name: Sync to Gitee and rebuild Gitee Pages

# 每次 push 到 main：1) 把代码同步到 Gitee 2) 触发 Gitee Pages 重新部署。
# 也可以在 Actions 页面手动运行（workflow_dispatch）。
#
# 需要在 GitHub 仓库 Settings -> Secrets and variables -> Actions 里配置：
#   Secrets:
#     GITEE_PRIVATE_KEY  Gitee 账号对应的 SSH 私钥（公钥需加到 Gitee）
#     GITEE_TOKEN        Gitee 个人访问令牌（私人令牌）
#   Variables（可选，不填则用下面的默认值）：
#     GITEE_USERNAME     Gitee 用户名，默认 buaaplay
#     GITEE_REPO         Gitee 仓库名，默认 homepage（Pages 地址为 <user>.gitee.io/homepage）

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Set config
        id: cfg
        run: |
          echo "gitee_user=${{ vars.GITEE_USERNAME || 'buaaplay' }}" >> "$GITHUB_OUTPUT"
          echo "gitee_repo=${{ vars.GITEE_REPO || 'homepage' }}" >> "$GITHUB_OUTPUT"

      - name: Mirror code to Gitee
        uses: Yikun/hub-mirror-action@master
        with:
          src: github/buaaplay
          dst: gitee/${{ steps.cfg.outputs.gitee_user }}
          dst_key: ${{ secrets.GITEE_PRIVATE_KEY }}
          dst_token: ${{ secrets.GITEE_TOKEN }}
          account_type: user
          clone_style: https
          force_update: true
          static_list: "buaaplay.github.io"
          mappings: "buaaplay.github.io=>${{ steps.cfg.outputs.gitee_repo }}"

      - name: Trigger Gitee Pages rebuild
        run: |
          curl -sS -X POST \
            --data-urlencode "access_token=${{ secrets.GITEE_TOKEN }}" \
            --data-urlencode "branch=main" \
            --data-urlencode "force=true" \
            "https://gitee.com/api/v5/repos/${{ steps.cfg.outputs.gitee_user }}/${{ steps.cfg.outputs.gitee_repo }}/pages/builds" \
            -w "\nHTTP %{http_code}\n"
