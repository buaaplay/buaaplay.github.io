name: Restore GitHub Pages after temporary unpublish

on:
  schedule:
    - cron: '0 0 15 10 *'
      timezone: Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the live site source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Restore the public site
        uses: actions/deploy-pages@v4
